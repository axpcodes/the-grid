<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Grid — humanity’s last mural</title>
    <meta name="description" content="A wall of one million squares. Leave words or a picture — made by a person, not generated. Once it’s up, it can’t be changed." />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="The Grid — humanity’s last mural" />
    <meta property="og:description" content="One million squares. One each. Words or a picture, made by a person. Permanent." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Monaco', monospace;
        background: #f3efe6;
        color: #1a1714;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within {
        outline: 2px solid #e2553b; outline-offset: 2px;
      }
      textarea:focus, input:focus { border-color: rgba(26,23,20,0.45) !important; }

      @keyframes fade-in  { from { opacity: 0 } to { opacity: 1 } }
      @keyframes fade-up  { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      @keyframes pop-in   { from { opacity: 0; transform: translateY(8px) scale(.98) } to { opacity: 1; transform: none } }
      @keyframes sheet-up { from { transform: translateY(100%) } to { transform: none } }
      @keyframes rise     { from { opacity: 0; transform: translateY(.45em); filter: blur(4px) } to { opacity: 1; transform: none; filter: blur(0) } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
